services:
  kubeman:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: kubeman-console:local
    container_name: kubeman
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - kubeman-data:/app/data

  # Single public entry point. Everything else stays on the private compose
  # network. Set KUBEMAN_BIND=0.0.0.0 to serve remote users, and put TLS in
  # front (KUBEMAN_SITE_ADDRESS=your.domain for built-in HTTPS, or your own proxy).
  kubeman-gateway:
    image: caddy:2-alpine
    container_name: kubeman-gateway
    restart: unless-stopped
    ports:
      - "${KUBEMAN_BIND:-127.0.0.1}:${KUBEMAN_PORT:-3080}:80"
      - "${KUBEMAN_BIND:-127.0.0.1}:${KUBEMAN_HTTPS_PORT:-3443}:443"
    environment:
      KUBEMAN_SITE_ADDRESS: "${KUBEMAN_SITE_ADDRESS:-:80}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - kubeman-gateway-data:/data
    security_opt:
      - no-new-privileges:true
    depends_on:
      kubeman:
        condition: service_healthy
      kubeman-shell:
        condition: service_healthy
      kubeman-aws:
        condition: service_healthy
      kubeman-bootstrap:
        condition: service_healthy

  kubeman-shell:
    build:
      context: .
      dockerfile: docker/Dockerfile.shell
    image: kubeman-shell:local
    container_name: kubeman-shell
    restart: unless-stopped
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      KUBECONFIG: /home/operator/.kubeman/kubeconfig
    volumes:
      - kubeman-shell-home:/home/operator
      - "${HOME}/.kube:/home/operator/.kube:ro"
      - "${HOME}/.aws:/home/operator/.aws:ro"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  kubeman-aws:
    build:
      context: .
      dockerfile: docker/Dockerfile.shell
    image: kubeman-shell:local
    container_name: kubeman-aws
    restart: unless-stopped
    command: ["python3", "/usr/local/bin/kubeman-aws-discovery"]
    environment:
      HOME: /home/operator
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - kubeman-shell-home:/home/operator
      - "${HOME}/.aws:/home/operator/.aws:ro"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7682/health"]
      interval: 15s
      timeout: 4s
      start_period: 8s
      retries: 4

  kubeman-bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.shell
    image: kubeman-shell:local
    container_name: kubeman-bootstrap
    restart: unless-stopped
    command: ["python3", "/usr/local/bin/kubeman-bootstrap"]
    environment:
      HOME: /home/operator
      PYTHONDONTWRITEBYTECODE: "1"
      KUBEMAN_GOOGLE_CLIENT_ID: "${KUBEMAN_GOOGLE_CLIENT_ID:-}"
      KUBEMAN_GOOGLE_CLIENT_SECRET: "${KUBEMAN_GOOGLE_CLIENT_SECRET:-}"
      # Browser-facing URL, e.g. https://kubeman.example.com. Leave empty to
      # derive it from the request (works for localhost and proxies that
      # forward Host / X-Forwarded-Proto).
      KUBEMAN_PUBLIC_URL: "${KUBEMAN_PUBLIC_URL:-}"
    volumes:
      - kubeman-bootstrap-data:/home/operator/.kubeman-bootstrap
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7683/health"]
      interval: 15s
      timeout: 4s
      start_period: 8s
      retries: 4

volumes:
  kubeman-data:
    name: kubeman-data
  kubeman-shell-home:
    name: kubeman-shell-home
  kubeman-bootstrap-data:
    name: kubeman-bootstrap-data
  kubeman-gateway-data:
    name: kubeman-gateway-data
