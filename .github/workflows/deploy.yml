name: Build, push to ECR and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of racing the server.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::236565801201:role/maimons-infra-github-ssm
  ECR_REPOSITORY: kubeman

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identity service tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # One ECR repository holds both images, told apart by tag prefix:
      #   kubeman:web-<sha>    web console
      #   kubeman:shell-<sha>  terminal, AWS discovery and identity services
      - name: Build images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile.web \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:web-$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:web-latest" .
          docker build -f docker/Dockerfile.shell \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:shell-$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:shell-latest" .

      - name: Push images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push --all-tags "$ECR_REGISTRY/$ECR_REPOSITORY"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/kubeman' }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload deployment files to S3
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Uploading deployment files to S3..."
          aws s3 cp compose.yaml s3://maimons-infra/kubeman/compose.yaml
          aws s3 cp compose.prod.yml s3://maimons-infra/kubeman/compose.prod.yml
          aws s3 cp deploy.sh s3://maimons-infra/kubeman/deploy.sh
          aws s3 cp docker/Caddyfile s3://maimons-infra/kubeman/Caddyfile

      - name: Deploy via SSM
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND=$(cat <<'EOF'
          set -euo pipefail

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf $WORK_DIR' EXIT

          cd "$WORK_DIR"

          # Download deployment files from S3
          echo "→ Downloading deployment files from S3..."
          aws s3 sync s3://maimons-infra/kubeman/ . --region eu-central-1

          # Move into deploy path (create if needed)
          DEPLOY_PATH=$DEPLOY_PATH
          mkdir -p "$DEPLOY_PATH"
          mv * "$DEPLOY_PATH/" 2>/dev/null || true

          # Execute deploy script
          echo "→ Running deploy script..."
          cd "$DEPLOY_PATH"
          chmod +x deploy.sh
          export ECR_REGISTRY='$ECR_REGISTRY'
          export IMAGE_TAG='$IMAGE_TAG'
          export AWS_REGION='eu-central-1'
          ./deploy.sh
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$COMMAND]" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command completion
          for i in {1..90}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            printf "[%2d/90] Status: %s\r" "$i" "$STATUS"
            sleep 2
          done

          echo ""
          echo "Final status: $STATUS"

          # Get output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")

          STDERR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'StandardErrorContent' \
            --output text 2>/dev/null || echo "")

          if [ -n "$OUTPUT" ]; then
            echo "=== Output ==="
            echo "$OUTPUT"
          fi

          if [ -n "$STDERR" ]; then
            echo "=== Errors ==="
            echo "$STDERR" >&2
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: Deployment failed with status: $STATUS" >&2
            exit 1
          fi

          echo "✓ Deployment successful"
